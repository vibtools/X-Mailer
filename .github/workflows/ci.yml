name: CI Build & Typecheck

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck (SPA & Server)
        run: npm run lint

      - name: TypeScript Typecheck (Cloudflare Edge Functions)
        run: npx tsc -p functions/tsconfig.json --noEmit

      - name: Production Vite Build
        run: npm run build
